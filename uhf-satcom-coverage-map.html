<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UHF SATCOM — GEO Coverage Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070b0c; --bg2:#0c1314; --panel:#0e1718; --line:#1d2b2c;
    --ink:#c9e8df; --dim:#5f7d78; --green:#39ffa6; --amber:#ffb000;
    --glow:rgba(57,255,166,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'JetBrains Mono',monospace;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* layout */
  #app{display:grid;grid-template-columns:1fr 388px;grid-template-rows:auto 1fr;height:100vh}
  header{
    grid-column:1/-1;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding:12px 18px;background:linear-gradient(180deg,#0c1314,#080d0e);
    border-bottom:1px solid var(--line);z-index:500;
  }
  header .badge{
    font-family:'Chakra Petch';font-weight:700;font-size:13px;letter-spacing:2px;
    color:var(--green);text-shadow:0 0 12px var(--glow);
    border:1px solid #1f4138;padding:5px 10px;border-radius:3px;background:#0a1614;
  }
  header h1{font-family:'Chakra Petch';font-weight:600;font-size:18px;letter-spacing:1px;white-space:nowrap}
  header h1 span{color:var(--dim);font-weight:400;font-size:12px;letter-spacing:1px}
  header .stats{margin-left:auto;display:flex;gap:22px;font-size:11px;color:var(--dim);letter-spacing:.5px}
  header .stats b{display:block;font-size:19px;color:var(--ink);font-family:'Chakra Petch';font-weight:700;letter-spacing:0}
  header .stats .g b{color:var(--green)}

  #map{grid-column:1;grid-row:2;background:#060a0b;position:relative}
  /* radar grid overlay */
  #map::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:401;
    background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.10) 3px 4px);mix-blend-mode:multiply}

  aside{
    grid-column:2;grid-row:2;background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden;
  }
  .controls{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
  .ctl-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim);letter-spacing:.5px;flex-wrap:wrap}
  .ctl-row .lbl{min-width:74px;text-transform:uppercase}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
  .seg button{
    background:transparent;color:var(--dim);border:0;font-family:inherit;font-size:11px;
    padding:4px 9px;cursor:pointer;border-right:1px solid var(--line)}
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--green);color:#04130d;font-weight:700}
  .toggle{cursor:pointer;user-select:none;color:var(--ink)}
  .toggle input{accent-color:var(--green);vertical-align:-2px;margin-right:5px}

  .listhead{padding:9px 14px;font-size:10px;letter-spacing:1.5px;color:var(--dim);
    text-transform:uppercase;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .sel-mini{background:#0a1414;color:var(--green);border:1px solid var(--line);border-radius:3px;
    font-family:inherit;font-size:10px;padding:3px 5px;cursor:pointer;letter-spacing:.5px}
  .sel-mini:focus{outline:1px solid var(--green)}

  /* channel table */
  .chanhead{padding:8px 14px;font-size:10px;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#0a1213;
    display:flex;justify-content:space-between;align-items:center;flex:none}
  .chanhead #chan-title{color:var(--green);font-family:'Chakra Petch';font-weight:600;letter-spacing:1px}
  .chanwrap{overflow-y:auto;flex:1.15;min-height:120px}
  .chantab{width:100%;border-collapse:collapse;font-size:10.5px}
  .chantab thead th{position:sticky;top:0;background:#0d1819;z-index:2;
    padding:6px 8px;text-align:left;color:var(--dim);font-weight:400;letter-spacing:.5px;
    border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
  .chantab thead th:hover{color:var(--ink)}
  .chantab thead th.sorted{color:var(--green)}
  .chantab thead th i{font-style:normal;font-size:8px;opacity:.9}
  .chantab th.num,.chantab td.num{text-align:right;font-variant-numeric:tabular-nums}
  .chantab tbody td{padding:4px 8px;border-bottom:1px solid #111c1d;white-space:nowrap}
  .chantab tbody tr:hover{background:#11201f}
  .chantab .rx{color:var(--green);font-weight:500}
  .chantab .tx{color:#7fa8a0}
  .chantab .s-Strong{color:var(--green)}
  .chantab .s-Medium{color:#cfe9b0}
  .chantab .s-Weak{color:#6f8f88}
  .chantab .act{color:var(--amber);font-size:9.5px}
  .chantab tr.off{opacity:.42}
  .list{overflow-y:auto;flex:1;min-height:96px}
  .sat{
    padding:10px 14px;border-bottom:1px solid #131f20;cursor:pointer;display:flex;gap:10px;align-items:center;
    transition:background .12s}
  .sat:hover{background:#11201f}
  .sat.sel{background:#10231d;box-shadow:inset 3px 0 0 var(--green)}
  .dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
  .sat .nm{font-family:'Chakra Petch';font-weight:600;font-size:13px;letter-spacing:.3px}
  .sat .meta{font-size:10px;color:var(--dim);margin-top:1px}
  .sat .ch{margin-left:auto;text-align:right}
  .sat .ch b{font-family:'Chakra Petch';font-size:15px;color:var(--ink)}
  .sat .ch span{display:block;font-size:9px;color:var(--dim);letter-spacing:.5px}
  .tag{display:inline-block;font-size:9px;padding:1px 5px;border-radius:2px;margin:2px 3px 0 0;
    border:1px solid #3a2a12;color:var(--amber);background:#1a1206;letter-spacing:.3px}
  .inactive .dot{color:#6b3a3a!important;background:#6b3a3a!important}

  /* legend */
  .legend{position:absolute;left:12px;bottom:12px;z-index:420;background:rgba(8,16,16,.86);
    border:1px solid var(--line);border-radius:4px;padding:10px 12px;backdrop-filter:blur(4px);font-size:10px;letter-spacing:.4px}
  .legend h4{font-family:'Chakra Petch';font-size:10px;letter-spacing:1.5px;color:var(--dim);margin-bottom:7px;text-transform:uppercase}
  .legend .row{display:flex;align-items:center;gap:7px;margin:3px 0;color:var(--ink)}
  .legend .sw{width:11px;height:11px;border-radius:2px;flex:none}

  /* leaflet skin */
  .leaflet-container{background:#060a0b;font-family:'JetBrains Mono',monospace}
  .leaflet-popup-content-wrapper{background:#0c1718;color:var(--ink);border:1px solid #20413a;border-radius:5px;box-shadow:0 0 24px rgba(57,255,166,.18)}
  .leaflet-popup-tip{background:#0c1718;border:1px solid #20413a}
  .leaflet-popup-content{margin:11px 13px;font-size:11px;line-height:1.55}
  .leaflet-popup-content h3{font-family:'Chakra Petch';font-size:15px;letter-spacing:.5px;margin-bottom:4px}
  .leaflet-popup-content .op{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}
  .leaflet-popup-content .kv{display:flex;justify-content:space-between;gap:18px;border-top:1px solid #18302b;padding:3px 0}
  .leaflet-popup-content .kv span:first-child{color:var(--dim)}
  .leaflet-bar a,.leaflet-control-attribution{background:#0c1718!important;color:var(--dim)!important;border-color:var(--line)!important}
  .leaflet-control-attribution a{color:var(--green)!important}
  .satlabel{font-family:'Chakra Petch';font-weight:600;font-size:11px;color:#dffaf0;
    text-shadow:0 0 5px #000,0 0 9px var(--glow);white-space:nowrap;letter-spacing:.3px}
  .satdiv{display:flex;flex-direction:column;align-items:center;transform:translateY(-3px)}
  .satdiv .pulse{width:13px;height:13px;border-radius:50%;border:2px solid #04130d;box-shadow:0 0 10px currentColor,0 0 3px #000}


  /* SAT column only in aggregate mode */
  .chantab .satcol{display:none}
  .chantab.showsat .satcol{display:table-cell;font-weight:500;max-width:88px;overflow:hidden;text-overflow:ellipsis}
  .chantab.showsat tbody tr{cursor:pointer}
  .sat.allrow{background:#0c1a19}
  .sat.allrow .nm{color:#cfe9e2}
  .sat.allrow.sel{box-shadow:inset 3px 0 0 var(--green)}

  /* pane tabs — mobile only */
  .ptabs{display:none;flex:none;border-bottom:1px solid var(--line);background:#0a1213}
  .ptabs button{flex:1;background:transparent;border:0;border-bottom:2px solid transparent;
    color:var(--dim);font-family:'Chakra Petch';font-weight:600;font-size:12px;letter-spacing:1px;
    padding:11px 6px;cursor:pointer;text-transform:uppercase;touch-action:manipulation}
  .ptabs button.on{color:var(--green);border-bottom-color:var(--green);background:#0d1a18}

  #burger{display:none}
  @media(max-width:860px){
    html,body{height:100%;overflow:hidden}
    #app{grid-template-columns:1fr;grid-template-rows:auto 38vh 1fr;height:100vh;height:100dvh}
    #map{grid-column:1;grid-row:2;min-height:0}
    aside{grid-column:1;grid-row:3;border-left:0;border-top:1px solid var(--line);min-height:0}
    .ptabs{display:flex}

    /* one pane at a time on mobile */
    body.pane-sats .chanhead,body.pane-sats .chanwrap{display:none}
    body.pane-chan .listhead,body.pane-chan .list{display:none}
    .list{flex:1;min-height:0;max-height:none}
    .chanwrap{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
    .chantab{min-width:430px}

    /* header condenses */
    header{padding:9px 12px;gap:10px}
    header h1{font-size:14px}
    header h1 span{display:none}
    header .badge{font-size:11px;padding:4px 8px}
    header .stats{gap:13px;width:auto}
    header .stats b{font-size:15px}
    header .stats div{font-size:9px}

    /* controls scroll sideways instead of wrapping into a wall */
    .controls{padding:9px 10px;gap:8px}
    .ctl-row{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
      scrollbar-width:none;padding-bottom:2px}
    .ctl-row::-webkit-scrollbar{display:none}
    .ctl-row .lbl{min-width:62px;flex:none;font-size:10px}
    .ctl-row > span:last-child{display:none}
    .seg{flex:none}
    .seg button{padding:7px 11px;font-size:11px;touch-action:manipulation}
    .toggle{flex:none;white-space:nowrap;padding:4px 0}
    .sel-mini{padding:6px 6px;font-size:11px}

    /* bigger touch targets */
    .sat{padding:12px 13px}
    .chantab tbody td{padding:8px 8px;font-size:11px}
    .chantab thead th{padding:9px 8px;font-size:10px}
    .legend{left:8px;bottom:8px;padding:7px 9px;font-size:9px;max-width:47%}
    .legend h4{font-size:9px;margin-bottom:4px}
    .legend .row{margin:2px 0}
    .leaflet-control-attribution{font-size:8px}
  }

  @media(max-width:420px){
    #app{grid-template-rows:auto 32vh 1fr}
    header .stats .g:nth-child(3),header .stats div:nth-child(3){display:none}
    .legend{display:none}
    .satlabel{font-size:10px}
  }

</style>
</head>
<body>
<div id="app">
  <header>
    <span class="badge">UHF SATCOM</span>
    <h1>GEO Coverage Map <span>// 240–270 MHz · Noise Floor Nomad DB</span></h1>
    <div class="stats">
      <div class="g"><b id="st-sat">0</b>SATELLITES</div>
      <div class="g"><b id="st-ch">0</b>CHANNELS</div>
      <div><b id="st-act">0</b>ACTIVE</div>
    </div>
  </header>

  <div id="map">
    <div class="legend">
      <h4>Operator / Nation</h4>
      <div id="leg"></div>
      <h4 style="margin-top:9px">Footprint = horizon visibility (0° elev)</h4>
    </div>
  </div>

  <aside>
    <div class="ptabs" id="ptabs">
      <button data-p="sats" class="on">Satellites</button>
      <button data-p="chan">Frequencies</button>
    </div>
    <div class="controls">
      <div class="ctl-row">
        <span class="lbl">Coverage</span>
        <div class="seg" id="cov">
          <button data-c="sel" class="on">Selected</button>
          <button data-c="all">All</button>
        </div>
        <span style="color:var(--dim)">footprint shown</span>
      </div>
      <div class="ctl-row">
        <span class="lbl">Bandwidth</span>
        <div class="seg" id="bw">
          <button data-b="all" class="on">All</button>
          <button data-b="6">6</button>
          <button data-b="25">25</button>
          <button data-b="28">28</button>
          <button data-b="38">38</button>
          <button data-b="575">575</button>
        </div>
        <span style="color:var(--dim)">kHz</span>
      </div>
      <div class="ctl-row">
        <span class="lbl">Min Elev</span>
        <div class="seg" id="elev">
          <button data-e="0" class="on">0°</button>
          <button data-e="5">5°</button>
          <button data-e="10">10°</button>
        </div>
        <label class="toggle" style="margin-left:auto"><input type="checkbox" id="tg-active">Active only</label>
      </div>
    </div>
    <div class="listhead">
      <span>Satellites</span>
      <select id="satsort" class="sel-mini">
        <option value="lon">Slot W→E</option>
        <option value="ch">Most channels</option>
        <option value="rxlo">Lowest RX freq</option>
        <option value="rxhi">Highest RX freq</option>
        <option value="name">Name A–Z</option>
      </select>
    </div>
    <div class="list" id="list"></div>

    <div class="chanhead">
      <span id="chan-title">Channels</span>
      <span id="chan-count"></span>
    </div>
    <div class="chanwrap">
      <table class="chantab" id="chantab">
        <thead>
          <tr>
            <th data-s="sat" class="satcol">Sat <i></i></th>
            <th data-s="rx" class="num sorted">RX <i>▲</i></th>
            <th data-s="tx" class="num">TX <i></i></th>
            <th data-s="bw" class="num">BW <i></i></th>
            <th data-s="sens">Sens <i></i></th>
            <th data-s="act">Activity <i></i></th>
          </tr>
        </thead>
        <tbody id="chan-body"></tbody>
      </table>
    </div>
  </aside>
</div>

 {name:"UFO 10",pos:"22.9°W",lon:-22.9,ch:11,active:11,inactive:0,bw:{"6":1,"25":8,"28":2},traffic:["Brazil","Brazil Music"]},

 {name:"SICRAL 1B",pos:"11.8°E",lon:11.8,ch:9,active:9,inactive:0,bw:{"25":9},traffic:["RU Traffic"]},

 {name:"UFO 2",pos:"28.7°E",lon:28.7,ch:6,active:6,inactive:0,bw:{"25":6},traffic:["UA Ukraine","RU Traffic"]},
 {name:"Skynet 4C",pos:"33.4°E",lon:33.4,ch:1,active:1,inactive:0,bw:{"25":1},traffic:[]},

 {name:"UFO 11",pos:"75.6°E",lon:75.6,ch:58,active:58,inactive:0,bw:{"6":33,"25":24,"-":1},traffic:["Duty","MOLITVA Prayer","RU Traffic"]},

SATS.forEach(s=>{
  s.op=ofSat(s.name); s.color=OP[s.op].c;
  const rows=CH[s.name]||[];
  s.rx=rows.map(r=>r[0]);

document.getElementById('st-ch').textContent=SATS.reduce((a,s)=>a+s.ch,0);

// map

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{

// geodesic footprint polygon around equatorial sub-satellite point
function footprint(lon,radiusDeg){
  const lat1=0, lon1=lon*Math.PI/180, d=radiusDeg*Math.PI/180, pts=[];
  for(let b=0;b<=360;b+=3){
    const th=b*Math.PI/180;
    const lat=Math.asin(Math.sin(lat1)*Math.cos(d)+Math.cos(lat1)*Math.sin(d)*Math.cos(th));
    const lon2=lon1+Math.atan2(Math.sin(th)*Math.sin(d)*Math.cos(lat1),Math.cos(d)-Math.sin(lat1)*Math.sin(lat));
    pts.push([lat*180/Math.PI, lon2*180/Math.PI]);
  }
  // unwrap longitudes to keep polygon continuous around its center
  for(let i=1;i<pts.length;i++){
    let dl=pts[i][1]-pts[i-1][1];
    if(dl>180)pts[i][1]-=360; else if(dl<-180)pts[i][1]+=360;
  }
  return pts;
}
function radiusForElev(e){ // earth-central half-angle (deg) for min elevation e
  const er=e*Math.PI/180;
  return (Math.acos(RATIO*Math.cos(er))-er)*180/Math.PI;
}

let elev=0, coverageMode='sel', activeOnly=false, bwFilter='all', selected=null;
const layers={}; // name -> {foot:[poly...], marker}

const visible=s=> (!activeOnly || s.active>0) && (bwFilter==='all' || (s.bw && s.bw[bwFilter]>0));

function draw(){
  Object.values(layers).forEach(L0=>{L0.foot.forEach(p=>map.removeLayer(p));map.removeLayer(L0.marker);});
  for(const k in layers)delete layers[k];
  const r=radiusForElev(elev);
  SATS.forEach(s=>{
    if(!visible(s))return;
    const showFp = coverageMode==='all' || !selected || s.name===selected;
    const isSel = s.name===selected;
    const polys=[];
    if(showFp){
      const base=footprint(s.lon,r);
      [-360,0,360].forEach(off=>{
        const ring=base.map(p=>[Math.max(-89,Math.min(89,p[0])),p[1]+off]);
        const poly=L.polygon(ring,{color:s.color,weight:isSel?2.2:1.2,
          opacity:isSel?.95:.5, fillColor:s.color, fillOpacity:isSel?.20:.06,
          interactive:false}).addTo(map);
        polys.push(poly);
      });
    }
    const html=`<div class="satdiv"><div class="pulse" style="background:${s.color};color:${s.color}"></div>`
      +`<div class="satlabel">${s.name}</div></div>`;
    const icon=L.divIcon({className:'',html,iconSize:[0,0],iconAnchor:[0,0]});
    const m=L.marker([0,s.lon],{icon,opacity:isSel?1:(selected?.7:1)}).addTo(map);
    m.bindPopup(popupHTML(s));
    m.on('click',()=>select(s.name));
    layers[s.name]={foot:polys,marker:m};
  });
}

function bwSummary(s){
  return Object.entries(s.bw).filter(([k])=>k!=='-')
    .sort((a,b)=>(+a[0])-(+b[0])).map(([k,n])=>`${k}k×${n}`).join('  ');
}

function popupHTML(s){
  const tags=s.traffic.length?`<div style="margin-top:6px">${s.traffic.map(t=>`<span class="tag">${t}</span>`).join('')}</div>`:'';
  return `<h3 style="color:${s.color}">${s.name}</h3>
    <div class="op">${OP[s.op].name}</div>
    <div class="kv"><span>Orbital slot</span><span>${s.pos} (GEO)</span></div>
    <div class="kv"><span>Channels</span><span>${s.ch}</span></div>
    <div class="kv"><span>Active / Inactive</span><span>${s.active} / ${s.inactive}</span></div>
    <div class="kv"><span>Bandwidths</span><span>${bwSummary(s)} kHz</span></div>
    ${tags}`;
}

function select(name){
  selected=(name && name===selected)?null:name;   // click again to deselect
  draw();
  renderChannels();
  document.querySelectorAll('.sat').forEach(el=>
    el.classList.toggle('sel', selected? el.dataset.n===selected : el.classList.contains('allrow')));
  if(isMobile()&&selected)setPane('chan');
  if(!selected){map.closePopup();return;}
  if(layers[selected])layers[selected].marker.openPopup();
  const s=SATS.find(x=>x.name===selected);
  if(s)map.panTo([0,s.lon],{animate:true});
}

// ---------- channel frequency table ----------
let chSort='rx', chDir=1;
const fmt=n=>n.toFixed(3);

// rows are [rx,tx,bw,sens,act,on]; we append sat name as index 6
function chanRows(name){
  let rows=[];
  if(name){
    rows=(CH[name]||[]).map(r=>r.concat([name]));
  }else{
    // aggregate: every channel of every currently-visible satellite
    SATS.filter(visible).forEach(s=>{
      (CH[s.name]||[]).forEach(r=>rows.push(r.concat([s.name])));
    });
  }
  if(bwFilter!=='all') rows=rows.filter(r=>String(r[2])===bwFilter);
  if(activeOnly) rows=rows.filter(r=>r[5]===1);
  const idx={sat:6,rx:0,tx:1,bw:2,sens:3,act:4}[chSort];
  const rank={Strong:3,Medium:2,Weak:1,"":0};
  rows.sort((a,b)=>{
    let x=a[idx],y=b[idx];
    if(chSort==='sens'){x=rank[x];y=rank[y];}
    if(chSort==='bw'){x=x??-1;y=y??-1;}
    if(typeof x==='string'||typeof y==='string')
      return chDir*String(x||'~').localeCompare(String(y||'~'));
    return chDir*(x-y);
  });
  return rows;
}

function renderChannels(){
  const body=document.getElementById('chan-body');
  const title=document.getElementById('chan-title');
  const count=document.getElementById('chan-count');
  const tab=document.getElementById('chantab');
  const agg=!selected;                       // aggregate mode when nothing selected
  tab.classList.toggle('showsat',agg);       // reveals the SAT column
  if(agg && chSort==='sat'){} else if(!agg && chSort==='sat'){chSort='rx';chDir=1;}
  const rows=chanRows(selected);
  if(agg){
    title.textContent='All satellites';
    title.style.color='var(--green)';
    count.textContent=`${rows.length} channels`;
  }else{
    const s=SATS.find(x=>x.name===selected);
    title.textContent=selected;
    title.style.color=s.color;
    count.textContent=`${rows.length} ch · ${s.pos}`;
  }
  const colorOf={}; SATS.forEach(s=>colorOf[s.name]=s.color);
  body.innerHTML=rows.map(r=>{
    const [rx,tx,bw,sens,act,on,sat]=r;
    return `<tr class="${on?'':'off'}" data-n="${sat}">
      <td class="satcol" style="color:${colorOf[sat]}">${sat}</td>
      <td class="num rx">${fmt(rx)}</td>
      <td class="num tx">${fmt(tx)}</td>
      <td class="num">${bw??'–'}</td>
      <td class="s-${sens}">${sens||'–'}</td>
      <td class="act">${act||''}</td></tr>`;
  }).join('') || '<tr><td colspan="6" style="padding:14px;color:var(--dim)">No channels match filter.</td></tr>';
  document.querySelectorAll('.chantab th').forEach(th=>{
    const on=th.dataset.s===chSort;
    th.classList.toggle('sorted',on);
    th.querySelector('i').textContent=on?(chDir===1?'▲':'▼'):'';
  });
}

// clicking a row in aggregate mode jumps to that satellite
document.getElementById('chan-body').addEventListener('click',e=>{
  const tr=e.target.closest('tr');
  if(!selected && tr && tr.dataset.n) select(tr.dataset.n);
});

document.querySelector('.chantab thead').addEventListener('click',e=>{
  const th=e.target.closest('th'); if(!th)return;
  const k=th.dataset.s;
  if(k===chSort)chDir*=-1; else {chSort=k;chDir=1;}
  renderChannels();
});

// ---------- satellite list sorting ----------
let satSort='lon';
function sortedSats(){
  const arr=SATS.filter(visible);
  const cmp={
    lon:(a,b)=>a.lon-b.lon,
    ch:(a,b)=>b.ch-a.ch,
    rxlo:(a,b)=>a.rxlo-b.rxlo,
    rxhi:(a,b)=>b.rxhi-a.rxhi,
    name:(a,b)=>a.name.localeCompare(b.name),
  }[satSort];
  return arr.sort(cmp);
}
document.getElementById('satsort').addEventListener('change',e=>{
  satSort=e.target.value; buildList();
});
const list=document.getElementById('list');
function buildList(){
  list.innerHTML='';
  const shown=sortedSats();
  const all=document.createElement('div');
  all.className='sat allrow'+(selected?'':' sel');
  all.innerHTML=`<span class="dot" style="color:#8fb3ac;background:#8fb3ac"></span>
    <div><div class="nm">All satellites</div>
    <div class="meta">show every channel · all footprints</div></div>
    <div class="ch"><b>${shown.reduce((a,x)=>a+x.ch,0)}</b><span>total</span></div>`;
  all.onclick=()=>select(null);
  list.appendChild(all);
  if(!shown.length){list.insertAdjacentHTML('beforeend','<div style="padding:18px;color:var(--dim);font-size:11px">No satellites match this filter.</div>');return;}
  shown.forEach(s=>{
    const row=document.createElement('div');
    row.className='sat'+(s.active===0?' inactive':'')+(s.name===selected?' sel':'');
    row.dataset.n=s.name;
    const tags=s.traffic.slice(0,3).map(t=>`<span class="tag">${t}</span>`).join('');
    row.innerHTML=`<span class="dot" style="color:${s.color};background:${s.color}"></span>
      <div><div class="nm">${s.name}</div>
      <div class="meta">${s.pos} · RX ${fmt(s.rxlo)}–${fmt(s.rxhi)}</div>${tags}</div>
      <div class="ch"><b>${s.ch}</b><span>${s.active} act</span></div>`;
    row.onclick=()=>select(s.name);
    list.appendChild(row);
  });
}

function refilter(){
  if(selected){
    const cur=SATS.find(s=>s.name===selected);
    if(!cur||!visible(cur))selected=null;   // fall back to the all-satellites view
  }
  buildList(); draw(); renderChannels();
  if(selected && layers[selected])layers[selected].marker.openPopup();
}

});

  if(e.target.tagName!=='BUTTON')return;
  document.querySelectorAll('#bw button').forEach(b=>b.classList.remove('on'));
  e.target.classList.add('on'); bwFilter=e.target.dataset.b; refilter();
});
document.getElementById('tg-active').addEventListener('change',e=>{activeOnly=e.target.checked;refilter();});

// ---------- mobile pane tabs ----------
const isMobile=()=>window.matchMedia('(max-width:860px)').matches;
function setPane(p){
  document.body.classList.toggle('pane-sats',p==='sats');
  document.body.classList.toggle('pane-chan',p==='chan');
  document.querySelectorAll('#ptabs button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  if(p==='chan')setTimeout(()=>map.invalidateSize(),60);
}
document.getElementById('ptabs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(b)setPane(b.dataset.p);
});
setPane('sats');
window.addEventListener('resize',()=>{map.invalidateSize();});
window.addEventListener('orientationchange',()=>setTimeout(()=>map.invalidateSize(),250));

buildList();
renderChannels();   // opens on the all-satellites frequency list
draw();
</script>

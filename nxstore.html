  <script>
    // ── CONFIG ────────────────────────────────────────────────────────────────
    const CDN   = 'https://pub-d94462df19ec4537a3506047362af020.r2.dev';
    const CACHE = CDN + '/games_cache_switch.json';
    const PCSS  = CDN + '/ui_patch.css';
    const PJS   = CDN + '/ui_patch.js';

    // catalog at rest is AES-256-GCM encrypted (base64: 12-byte IV || ciphertext+tag)
    // so a bare hit on the CDN URL returns ciphertext, not a readable game list.
    const CATALOG_KEY_B64 = 'reAdri6QXYOoyUhxfKLAWnvlNzJGykvfpf3ZmDYmWGw=';
    let _catalogCryptoKey = null;
    async function decryptCatalogText(b64blob) {
      // graceful transition: until the live catalog is actually flipped to
      // encrypted, the CDN still serves plaintext JSON -- pass it through
      // unchanged rather than trying (and failing) to decrypt it.
      const trimmed = (b64blob || '').trim();
      if (trimmed.startsWith('[') || trimmed.startsWith('{')) return trimmed;
      const binStr = atob(b64blob);
      const len = binStr.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) bytes[i] = binStr.charCodeAt(i);
      const iv = bytes.slice(0, 12);
      const ciphertext = bytes.slice(12);
      if (!_catalogCryptoKey) {
        const raw = Uint8Array.from(atob(CATALOG_KEY_B64), c => c.charCodeAt(0));
        _catalogCryptoKey = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);

    function expandMirrors(entries) {
      if (!Array.isArray(entries)) return [];
      const out = [];
      for (const g of entries) {
        if (!g || typeof g !== 'object') continue;
        if (g._group && Array.isArray(g.filehosts)) {
          for (const mm of expandMirrors(g.filehosts)) out.push(mm);
          continue;
        }
        const hostLabel = (g.label || '').toString().trim();
        const parts = Array.isArray(g.parts) ? g.parts : null;
        if (parts && parts.length > 0) {
          const hasAnyUrl = parts.some(p => p && p.url);
          if (!hasAnyUrl) {
            if (g.url) out.push({ url: g.url, text: hostLabel || 'Link', host: hostLabel });
            continue;
          }
          parts.forEach((p, i) => {
            if (!p || typeof p !== 'object' || !p.url) return;
            const partLabel = 'P' + String(i + 1).padStart(2, '0');
            const sizeBit   = p.size ? ' · ' + String(p.size).trim() : '';
            const fname     = (p.name || '').toString().trim();
            out.push({ url: p.url, text: partLabel, host: hostLabel, title: (fname || `${hostLabel || 'Part'} ${i + 1}`) + sizeBit });

          out.push({ url: g.url, text: hostLabel || 'Link', host: hostLabel });

    function renderMirrorsHTML(mirrors) {
      if (!Array.isArray(mirrors) || mirrors.length === 0) return '';

        const h = (m && m.host) || '';
        if (!bucketMap.has(h)) bucketMap.set(h, { firstIdx: idx, items: [], seenUrls: new Set() });
        const bucket = bucketMap.get(h);
        const url = m && m.url;
        if (url && bucket.seenUrls.has(url)) return;
        if (url) bucket.seenUrls.add(url);
        bucket.items.push(m);
      });
      const buckets = Array.from(bucketMap.entries()).sort((a, b) => a[1].firstIdx - b[1].firstIdx);
      return buckets.map(([host, { items }]) => {
        const urlCount = items.reduce((n, m) => n + (m && m.url ? 1 : 0), 0);
        let pno = 0;
        const buttons = items.map((m) => {
          if (m && m.url) {
            pno++;
            const label = urlCount >= 2 ? 'P' + String(pno).padStart(2, '0') : (host ? 'Open' : (m.text || 'Link'));

          : '';
        if (host) {
          return `<div class="mirror-group" data-host="${escH(host)}"><span class="mirror-group-label">${escH(host)}</span>${buttons}${copyBtn}</div>`;
        }
        return `<div class="mirror-group-single">${buttons}${copyBtn}</div>`;
      }).join('');

    function toVersion(rel, idx, extra) {
      const fmt    = (rel.format||'').trim();
      const region = (rel.region||'').trim();
      let header;
      if (fmt && region) header = fmt + ' — ' + region;
      else if (fmt)      header = fmt;
      else if (region)   header = region + ' — Download #' + (idx+1);
      else               header = 'Download #' + (idx+1);
      const rows = [];
      if (rel.game && rel.game.length) rows.push({label:'Game', mirrors: expandMirrors(rel.game)});
      const _ru = rel.updates||[];
      if (_ru.length && _ru[0] && _ru[0].url && !_ru[0].filehosts) {
        rows.push({label:'Updates', mirrors: expandMirrors(_ru)});
      } else {
        for (const u of _ru) {
          const label = u.label || (u.version ? 'Update '+u.version : 'Update');
          const mirrors = expandMirrors(u.filehosts||u.game||[]);
          if (mirrors.length) rows.push({label, mirrors});
        }
      }
      const _rd = rel.dlc||[];
      if (_rd.length && _rd[0] && _rd[0].url && !_rd[0].filehosts) {
        rows.push({label:'DLC', mirrors: expandMirrors(_rd)});
      } else {
        for (const d of _rd) {
          const label = d.label || 'DLC';
          const mirrors = expandMirrors(d.filehosts||d.game||[]);
          if (mirrors.length) rows.push({label, mirrors});
        }
      }
      return {
        header,
        credit:   (rel.contributor||'').trim(),
        rows,
        password: (rel.password||'').trim(),
        voice:    '',
        menuSubs: '',
        note:     (rel.note||'').trim(),

          const note=v.note?`<div class="note-line">${escH(v.note)}</div>`:'';
          html+=`<div class="version-block ${idx===0?'open':''}">
            <div class="version-header" role="button" tabindex="0" aria-expanded="${idx===0?'true':'false'}"><span class="version-title">${escH(v.header)}</span>${credit}<span class="version-chevron">&#9660;</span></div>
            <div class="version-content">${rows}${info}${note}</div>
          </div>`;
        });
      } else { html='<div class="no-versions">No download links found.</div>'; }

      modalLinks.innerHTML=html;
      wireEvents(data);
      if(typeof UIHooks.afterModalPopulated==='function')UIHooks.afterModalPopulated(game,data,els);
    }

    function wireEvents(data){
      const ts=data._ts?new Date(data._ts).toLocaleString():'';
      const bar=document.createElement('div');
      bar.style.cssText='display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.07);font-size:0.75em;color:#667799;';
      bar.innerHTML=`<span>Loaded: ${escH(ts)}</span><button id="reloadBtn" style="padding:3px 10px;border-radius:6px;background:rgba(30,60,120,0.6);color:#99ccff;border:1px solid rgba(80,130,220,0.4);cursor:pointer;font-size:1em;">&#8635; Reload</button>`;
      modalLinks.appendChild(bar);
      document.getElementById('reloadBtn').onclick=async()=>{
        bar.innerHTML='<span style="color:#aabbcc;">Reloading…</span>';
        try{await loadCache(true);const e=_map.get(currentGame.url);if(!e)throw new Error('Not found');reopenModal(currentGame,toDetail(e,_ts));}
        catch(e){bar.innerHTML=`<span style="color:#ff6666;">Failed: ${escH(_ee(e))}</span>`;}
      };
      modalLinks.querySelectorAll('.version-header').forEach(h=>{
        const toggle=()=>{const b=h.closest('.version-block');const open=b.classList.toggle('open');h.setAttribute('aria-expanded',open?'true':'false');};
        h.onclick=toggle;
        h.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}};
      });
      modalLinks.querySelectorAll('[data-href]').forEach(btn=>{
        btn.onclick=e=>{e.stopPropagation();e.preventDefault();openExternal(btn.getAttribute('data-href'));};
      });
      modalLinks.querySelectorAll('.password-val').forEach(el=>{
        const copy=()=>navigator.clipboard.writeText(el.textContent)
          .then(()=>{const t=el.title;el.title='Copied!';setTimeout(()=>el.title=t,1500);})
          .catch(()=>{});
        el.onclick=copy;
        el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();copy();}};
      });
      modalLinks.querySelectorAll('.copy-group').forEach(btn=>{
        btn.onclick=e=>{
          e.stopPropagation(); e.preventDefault();
          const grp=btn.closest('.mirror-group,.mirror-group-single'); if(!grp) return;
          const urls=Array.from(grp.querySelectorAll('.mirror-btn[data-href]'))
            .map(b=>b.getAttribute('data-href')).filter(Boolean);
          if(!urls.length) return;
          navigator.clipboard.writeText(urls.join('\n'))
            .then(()=>{const _t=btn.innerHTML; btn.textContent='✓'; btn.classList.add('copied');
              setTimeout(()=>{btn.innerHTML=_t; btn.classList.remove('copied');},1200);})
            .catch(()=>{});
        };
      });
    }

    const lightbox=document.getElementById('imgLightbox'),lbImg=document.getElementById('lbImg');
    const openLightbox=url=>{lbImg.src=url;lightbox.classList.add('open');};
    const closeLightbox=()=>{lightbox.classList.remove('open');lbImg.src='';};
    lightbox.addEventListener('click',e=>{if(e.target===lightbox)closeLightbox();});
    document.getElementById('lbClose').addEventListener('click',e=>{e.stopPropagation();closeLightbox();});
    document.getElementById('lbSave').addEventListener('click',async e=>{
      e.stopPropagation();
      const src=lbImg.src;
      const name=src.split('/').pop().split('?')[0]||'screenshot.jpg';
      const save=(href,revoke)=>{
        const a=document.createElement('a');a.href=href;a.download=name;
        document.body.appendChild(a);a.click();document.body.removeChild(a);
        if(revoke)setTimeout(()=>URL.revokeObjectURL(href),1000);
      };
      try {
        let blob;
        if (window.__TAURI__ && window.__TAURI__.http && window.__TAURI__.http.fetch) {
          const r=await window.__TAURI__.http.fetch(src,{method:'GET'});
          if(!r.ok) throw new Error('HTTP '+r.status);
          blob=await r.blob();
        } else {
          blob=await (await fetch(src)).blob();
        }
        save(URL.createObjectURL(blob),true);
      } catch {
        save(src,false);
      }
    });
    document.addEventListener('keydown',e=>{
      if(e.key!=='Escape')return;
      if(lightbox.classList.contains('open')){e.stopPropagation();closeLightbox();}
      else if(modal.classList.contains('open'))closeModal();
    });
  </script>


</body></html>
